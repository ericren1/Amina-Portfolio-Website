<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography and visual journalism portfolio.">
  <title>Photography portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editorial-theme.css">
  <link rel="stylesheet" href="one-page.css">
</head>
<body data-page="index">
  <div id="header"></div>
  <main>
    <section class="home-intro container" id="top">
      <p class="eyebrow">Photography / Graphic Design</p>
      <h1 id="hero-title">Portfolio</h1>
      <p id="hero-description"></p>
      <p class="home-location" id="hero-location"></p>
    </section>
    <section class="gallery-section" id="work" aria-labelledby="work-title">
      <div class="container">
        <div class="gallery-heading"><h2 id="work-title">Selected projects</h2><span id="photo-count"></span></div>
        <div id="portfolio-projects" class="portfolio-projects"></div>
        <p class="gallery-disclaimer">Illustrative image placeholders — replace with original photographs and verified captions before publishing.</p>
      </div>
    </section>

  </main>
  <div id="footer"></div>
  <script src="content.js"></script>
  <script src="site.js"></script>
</body>
</html>
